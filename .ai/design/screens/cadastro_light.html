<!DOCTYPE html><html lang="pt-BR" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-container": "#00714b", "on-error-container": "#93000a", "on-tertiary-container": "#202e2a", "tertiary-container": "#869690", "on-tertiary-fixed": "#101e1a", "error-container": "#ffdad6", "on-surface-variant": "#3d4a40", "outline-variant": "#bccabe", "surface-container": "#eaedff", "surface": "#faf8ff", "surface-tint": "#006d41", "tertiary-fixed": "#d5e6df", "secondary-fixed-dim": "#71dba6", "primary-container": "#00a868", "primary-fixed": "#78fbb2", "on-secondary": "#ffffff", "background": "#faf8ff", "on-tertiary": "#ffffff", "inverse-on-surface": "#eef0ff", "tertiary-fixed-dim": "#bacac4", "secondary-fixed": "#8df7c1", "on-primary": "#ffffff", "inverse-surface": "#283044", "on-surface": "#131b2e", "outline": "#6d7a70", "surface-container-high": "#e2e7ff", "surface-container-lowest": "#ffffff", "secondary-container": "#8af5be", "on-secondary-fixed": "#002113", "secondary": "#006c47", "on-error": "#ffffff", "primary": "#006d41", "tertiary": "#52625c", "on-tertiary-fixed-variant": "#3b4a45", "inverse-primary": "#59de98", "surface-bright": "#faf8ff", "on-primary-fixed-variant": "#005230", "on-primary-fixed": "#002110", "surface-container-highest": "#dae2fd", "error": "#ba1a1a", "surface-dim": "#d2d9f4", "primary-fixed-dim": "#59de98", "surface-container-low": "#f2f3ff", "on-background": "#131b2e", "surface-variant": "#dae2fd", "on-secondary-fixed-variant": "#005235", "on-primary-container": "#00331c" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-md": "1rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem" }, fontFamily: { "currency-display": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "currency-md": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "display": ["Inter"] }, fontSize: { "currency-display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "currency-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full px-margin bg-surface flex-1"><div class="flex flex-col w-full max-w-sm mx-auto items-center justify-center my-auto py-margin">
<!-- Subtle decorative ambient badge -->

<!-- 1. Top Section / Wordmark & Subtitle -->
<header class="flex flex-col items-center text-center mb-8 w-full">
  <div class="flex items-center justify-center gap-3 mb-2">
    <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shadow-md shadow-primary/20">
      <span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">payments</span>
    </div>
    <h1 class="font-display text-[36px] font-bold text-primary tracking-tight leading-none">Rateio</h1>
  </div>
  <p class="font-body-md text-body-md text-tertiary">Crie sua conta para começar</p>
</header>
<!-- 2. Form Container -->
<form class="w-full flex flex-col gap-[12px]" id="signup-form" onsubmit="return false;">
<!-- Field: E-mail -->
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface font-medium pl-0.5" for="email">
        E-mail
      </label>
<div class="relative flex items-center w-full rounded-lg bg-surface-container-low shadow-sm focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all duration-200">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-[44px] pl-10 pr-4 bg-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none" id="email" placeholder="seu@email.com" required="" type="email">
</div>
</div>
<!-- Field: Senha -->
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface font-medium pl-0.5" for="password">
        Senha
      </label>
<div class="relative flex items-center w-full rounded-lg bg-surface-container-low shadow-sm focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all duration-200">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="new-password" class="w-full h-[44px] pl-10 pr-10 bg-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidade da senha" class="absolute right-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none p-1" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon-pass">visibility</span>
</button>
</div>
</div>
<!-- Field: Confirmar senha -->
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface font-medium pl-0.5" for="confirm-password">
        Confirmar senha
      </label>
<div class="relative flex items-center w-full rounded-lg bg-surface-container-low shadow-sm focus-within:bg-surface-container-lowest focus-within:shadow-md transition-all duration-200">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="new-password" class="w-full h-[44px] pl-10 pr-10 bg-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:outline-none" id="confirm-password" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidade da confirmação de senha" class="absolute right-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none p-1" id="toggle-confirm-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon-confirm">visibility</span>
</button>
</div>
</div>
<!-- Dynamic Password Matching Feedback / Delight indicator -->
<div class="hidden flex items-center gap-1.5 px-1 font-body-sm text-body-sm text-primary" id="password-match-hint">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="">As senhas coincidem perfeitamente!</span>
</div>
<!-- 3. Primary Submit Button -->
<button class="mt-6 w-full h-12 rounded-lg bg-primary text-white font-label-lg text-label-lg font-semibold shadow-md shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 hover:opacity-95" id="submit-btn" type="submit">
  <span class="">Criar conta</span>
  <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- 4. Support Terms Text -->
<p class="font-body-sm text-body-sm text-outline text-center mt-4 px-2 leading-relaxed">
    Ao criar conta, você concorda com nossos 
    <a class="underline hover:text-on-surface transition-colors" href="#/termos">Termos de Uso</a> 
    e 
    <a class="underline hover:text-on-surface transition-colors" href="#/privacidade">Política de Privacidade</a>.
  </p>
<!-- 5. Bottom Navigation Action -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Já tem conta? 
      <a class="font-label-lg text-label-lg text-primary font-bold hover:underline ml-1 inline-flex items-center gap-0.5" href="#/login">
        Entrar
      </a>
</p>
</div>
</div>
<script>
  (function() {
    // Password visibility toggle helpers
    const setupVisibilityToggle = (inputId, btnId, iconId) => {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      const icon = document.getElementById(iconId);

      if (!input || !btn || !icon) return;

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    };

    setupVisibilityToggle('password', 'toggle-password', 'eye-icon-pass');
    setupVisibilityToggle('confirm-password', 'toggle-confirm-password', 'eye-icon-confirm');

    // Password matching micro-interaction
    const passInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const matchHint = document.getElementById('password-match-hint');

    const checkMatch = () => {
      if (!passInput || !confirmInput || !matchHint) return;
      const p1 = passInput.value;
      const p2 = confirmInput.value;
      if (p1.length >= 6 && p1 === p2) {
        matchHint.classList.remove('hidden');
      } else {
        matchHint.classList.add('hidden');
      }
    };

    passInput?.addEventListener('input', checkMatch);
    confirmInput?.addEventListener('input', checkMatch);
  })();
</script></main>

</body></html>

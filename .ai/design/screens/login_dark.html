afe flex flex-col min-h-screen"><main class="flex flex-col relative w-full px-margin bg-[#0F172A] flex-1"><div class="flex flex-col w-full items-center justify-between py-space-xl min-w-0">
<!-- Subtle Ambient Glow -->
<div class="w-full flex flex-col items-center max-w-sm mx-auto">
<!-- Brand / Header Section -->
<div class="flex flex-col items-center text-center mt-space-md mb-12"><div class="flex items-center justify-center gap-3 mb-2"><div class="w-12 h-12 rounded-xl bg-emerald-950/60 border border-emerald-500/30 flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-emerald-400 text-[28px]" style="font-variation-settings: 'FILL' 1;">payments</span></div><h1 class="font-display text-[36px] font-bold text-emerald-400 tracking-tight leading-none">Rateio</h1></div><p class="font-body-md text-body-md text-slate-400 mt-1">Controle de despesas compartilhadas</p></div>
<!-- Login Form Card Structure -->
<div class="w-full bg-[#1E293B] border border-[#334155] rounded-xl p-space-lg shadow-sm"><form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();"><div class="flex flex-col gap-space-xs"><label class="font-label-md text-label-md text-slate-200" for="email">E-mail</label><div class="relative flex items-center w-full"><span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">mail</span><input class="w-full h-11 pl-10 pr-3 rounded-lg bg-[#0F172A] border border-[#334155] text-slate-100 placeholder:text-slate-500 text-body-md font-body-md transition-all focus:outline-none focus:border-emerald-400" id="email" placeholder="seu@email.com" type="email"></div></div><div class="flex flex-col gap-space-xs"><div class="flex items-center justify-between"><label class="font-label-md text-label-md text-slate-200" for="password">Senha</label><a class="font-label-md text-label-md text-emerald-400 font-medium hover:underline" href="#/esqueci-senha">Esqueci minha senha</a></div><div class="relative flex items-center w-full"><span class="material-symbols-outlined absolute left-3 text-slate-400 text-[20px] pointer-events-none">lock</span><input class="w-full h-11 pl-10 pr-10 rounded-lg bg-[#0F172A] border border-[#334155] text-slate-100 placeholder:text-slate-500 text-body-md font-body-md transition-all focus:outline-none focus:border-emerald-400" id="password" placeholder="••••••••" type="password"><button aria-label="Alternar visibilidade da senha" class="absolute right-3 flex items-center justify-center text-slate-400 hover:text-slate-200 focus:outline-none" id="togglePassword" type="button"><span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span></button></div></div><button class="w-full h-12 mt-space-sm bg-emerald-400 text-slate-900 font-label-lg text-label-lg rounded-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-space-xs font-semibold" type="submit"><span class="">Entrar</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button></form></div>
<!-- Divider -->
<div class="flex items-center w-full my-space-lg"><div class="flex-grow h-px bg-[#334155]"></div><span class="px-space-md text-slate-400 font-body-sm text-body-sm uppercase tracking-wider">ou</span><div class="flex-grow h-px bg-[#334155]"></div></div>
<!-- Sign-up Redirect Prompt -->
<div class="flex items-center justify-center gap-space-xs text-center"><span class="font-body-md text-body-md text-slate-400">Não tem conta?</span><a class="font-label-lg text-label-lg text-emerald-400 font-bold hover:underline" href="#/cadastro">Criar conta</a></div>
<!-- Micro-interaction Visual Proof Points -->
<div class="mt-space-xl flex items-center justify-center gap-2 text-slate-400 text-body-sm opacity-90"><span class="material-symbols-outlined text-[16px] text-emerald-400">lock</span><span class="">Conexão segura &amp; criptografada</span></div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>

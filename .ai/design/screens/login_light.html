<!DOCTYPE html><html lang="pt-BR" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-container": "#00714b", "on-error-container": "#93000a", "on-tertiary-container": "#202e2a", "tertiary-container": "#869690", "on-tertiary-fixed": "#101e1a", "error-container": "#ffdad6", "on-surface-variant": "#3d4a40", "outline-variant": "#bccabe", "surface-container": "#eaedff", "surface": "#faf8ff", "surface-tint": "#006d41", "tertiary-fixed": "#d5e6df", "secondary-fixed-dim": "#71dba6", "primary-container": "#00a868", "primary-fixed": "#78fbb2", "on-secondary": "#ffffff", "background": "#faf8ff", "on-tertiary": "#ffffff", "inverse-on-surface": "#eef0ff", "tertiary-fixed-dim": "#bacac4", "secondary-fixed": "#8df7c1", "on-primary": "#ffffff", "inverse-surface": "#283044", "on-surface": "#131b2e", "outline": "#6d7a70", "surface-container-high": "#e2e7ff", "surface-container-lowest": "#ffffff", "secondary-container": "#8af5be", "on-secondary-fixed": "#002113", "secondary": "#006c47", "on-error": "#ffffff", "primary": "#006d41", "tertiary": "#52625c", "on-tertiary-fixed-variant": "#3b4a45", "inverse-primary": "#59de98", "surface-bright": "#faf8ff", "on-primary-fixed-variant": "#005230", "on-primary-fixed": "#002110", "surface-container-highest": "#dae2fd", "error": "#ba1a1a", "surface-dim": "#d2d9f4", "primary-fixed-dim": "#59de98", "surface-container-low": "#f2f3ff", "on-background": "#131b2e", "surface-variant": "#dae2fd", "on-secondary-fixed-variant": "#005235", "on-primary-container": "#00331c" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-md": "1rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem" }, fontFamily: { "currency-display": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "currency-md": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "display": ["Inter"] }, fontSize: { "currency-display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "currency-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full px-margin bg-surface flex-1"><div class="flex flex-col w-full justify-between py-space-xl">
<!-- Área Superior: Branding e Boas-Vindas -->
<div class="flex flex-col items-center text-center mt-space-lg mb-12"><div class="flex flex-row items-center justify-center gap-3"><div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm"><span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">payments</span></div><h1 class="font-display text-display text-primary tracking-tight font-bold">Rateio</h1></div><p class="font-body-md text-body-md text-tertiary mt-space-xs">Controle de despesas compartilhadas</p></div>
<!-- Formulário Central -->
<div class="w-full flex flex-col">
<form class="flex flex-col w-full space-y-space-sm" onsubmit="event.preventDefault();">
<!-- Campo E-mail -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">
          E-mail
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-tertiary select-none text-[20px]">
            mail
          </span>
<input autocomplete="email" class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#00a868]" id="email" name="email" placeholder="seu@email.com" type="email">
</div>
</div>
<!-- Campo Senha -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">
          Senha
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-tertiary select-none text-[20px]">
            lock
          </span>
<input class="w-full h-11 pl-10 pr-10 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#00a868]" id="password" name="password" placeholder="••••••••" type="password">
<button aria-label="Revelar senha" class="absolute right-3 text-tertiary hover:text-on-surface focus:outline-none flex items-center justify-center p-1 rounded transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Esqueci minha senha -->
<div class="flex justify-end pt-space-xs">
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#/esqueci-senha">Esqueci minha senha</a>
</div>
<!-- Botão Entrar -->
<div class="pt-space-lg">
<button class="w-full h-12 rounded-lg bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-space-xs shadow-md active:scale-[0.98] transition-transform duration-150 cursor-pointer font-semibold" type="submit"><span class="">Entrar</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
</div>
</form>
</div>
<!-- Área Inferior: Divisor e Registro -->
<div class="flex flex-col items-center mt-space-xl">
<!-- Divisor com "ou" -->
<div class="relative w-full flex items-center justify-center my-space-md">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute px-space-sm bg-surface font-label-sm text-label-sm text-tertiary uppercase tracking-wider">
        ou
      </span>
</div>
<!-- Redirecionamento de Cadastro -->
<p class="font-body-md text-body-md text-on-surface mt-space-sm text-center">
      Não tem conta? 
      <a class="font-headline-sm text-headline-sm text-primary font-bold hover:underline transition-all ml-1" href="#/cadastro">Criar conta</a>
</p>
<!-- Indicador de Segurança Sutil -->
<div class="flex items-center gap-1.5 mt-space-lg text-tertiary opacity-75">
<span class="material-symbols-outlined text-[16px]">
        verified_user
      </span>
<span class="font-label-sm text-label-sm">
        Conexão segura &amp; criptografada
      </span>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Revelar senha');
      });
    }
  })();
</script></main>

</body></html>

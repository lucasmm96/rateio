<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Reembolso (Light)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#00A868',
              hover: '#00875A',
              soft: '#E6F7F0',
            },
            surface: {
              DEFAULT: '#FFFFFF',
              card: '#F8FAFC',
            },
            on: {
              surface: '#0F172A',
              'surface-variant': '#64748B',
            },
            outline: {
              DEFAULT: '#E2E8F0',
            },
            error: {
              DEFAULT: '#DC2626',
            },
            warning: {
              DEFAULT: '#D97706',
              soft: '#FEF3C7',
            }
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#FFFFFF] dark:bg-[#0F172A] text-[#0F172A] dark:text-[#F1F5F9] font-sans antialiased min-h-screen flex flex-col justify-between max-w-[390px] mx-auto border-x border-[#E2E8F0] dark:border-[#334155] relative pb-8">
  <!-- Header fixo -->
  <header class="sticky top-0 z-50 h-16 bg-[#FFFFFF]/90 dark:bg-[#0F172A]/90 backdrop-blur-xl border-b border-[#E2E8F0] dark:border-[#334155] px-4 flex items-center justify-between">
    <a href="#/rateios/1" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-[#64748B] dark:text-[#94A3B8] hover:bg-[#F8FAFC] dark:hover:bg-[#1E293B] transition-colors" aria-label="Voltar">
      <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    </a>
    <h1 class="text-[18px] font-semibold text-[#0F172A] dark:text-[#F1F5F9]">Novo reembolso</h1>
    <div class="w-10 h-10"></div>
  </header>

  <!-- Conteúdo rolável -->
  <main class="flex-1 px-4 py-5 space-y-5">
    <!-- Campo Data -->
    <div class="space-y-1.5">
      <label for="reembolso-data" class="block text-[14px] font-medium text-[#64748B] dark:text-[#94A3B8]">Data</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[20px] text-[#64748B] dark:text-[#94A3B8] pointer-events-none">calendar_today</span>
        <input type="text" id="reembolso-data" value="15/08/2026" class="w-full h-11 pl-10 pr-3 rounded-lg border border-[#E2E8F0] dark:border-[#334155] bg-[#F8FAFC] dark:bg-[#1E293B] text-[#0F172A] dark:text-[#F1F5F9] text-[15px] focus:outline-none focus:ring-2 focus:ring-[#00A868] dark:focus:ring-[#34D399] transition-all" />
      </div>
    </div>

    <!-- Campo Pagador (quem reembolsa) -->
    <div class="space-y-1.5">
      <label for="reembolso-pagador" class="block text-[14px] font-medium text-[#64748B] dark:text-[#94A3B8]">Pagador (quem reembolsa)</label>
      <div class="relative">
        <div class="absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-[#E0E7FF] dark:bg-[#3730A3] text-[#4338CA] dark:text-[#C7D2FE] flex items-center justify-center text-[11px] font-bold pointer-events-none">
          BS
        </div>
        <select id="reembolso-pagador" class="w-full h-11 pl-11 pr-9 rounded-lg border border-[#E2E8F0] dark:border-[#334155] bg-[#F8FAFC] dark:bg-[#1E293B] text-[#0F172A] dark:text-[#F1F5F9] text-[15px] appearance-none focus:outline-none focus:ring-2 focus:ring-[#00A868] dark:focus:ring-[#34D399] transition-all">
          <option value="beatriz" selected>Beatriz Silveira</option>
          <option value="lucas">Lucas Mendes (Você)</option>
          <option value="rodrigo">Rodrigo Fagundes</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-[20px] text-[#64748B] dark:text-[#94A3B8] pointer-events-none">expand_more</span>
      </div>
    </div>

    <!-- Campo Recebedor (quem recebe) -->
    <div class="space-y-1.5">
      <label for="reembolso-recebedor" class="block text-[14px] font-medium text-[#64748B] dark:text-[#94A3B8]">Recebedor (quem recebe)</label>
      <div class="relative">
        <div class="absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-[#E6F7F0] dark:bg-[#064E3B] text-[#00A868] dark:text-[#34D399] flex items-center justify-center text-[11px] font-bold pointer-events-none">
          LM
        </div>
        <select id="reembolso-recebedor" class="w-full h-11 pl-11 pr-9 rounded-lg border border-[#E2E8F0] dark:border-[#334155] bg-[#F8FAFC] dark:bg-[#1E293B] text-[#0F172A] dark:text-[#F1F5F9] text-[15px] appearance-none focus:outline-none focus:ring-2 focus:ring-[#00A868] dark:focus:ring-[#34D399] transition-all">
          <option value="lucas" selected>Lucas Mendes (Você)</option>
          <option value="beatriz">Beatriz Silveira</option>
          <option value="rodrigo">Rodrigo Fagundes</option>
        </select>
        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-[20px] text-[#64748B] dark:text-[#94A3B8] pointer-events-none">expand_more</span>
      </div>
    </div>

    <!-- Chip de sugestão de saldo existente -->
    <div class="w-full p-3 rounded-lg bg-[#E6F7F0] dark:bg-[#064E3B]/70 border border-[#00A868] dark:border-[#34D399] flex items-center justify-between gap-2 transition-all">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[#00A868] dark:text-[#34D399] text-[20px] shrink-0">lightbulb</span>
        <p class="text-[13px] text-[#0F172A] dark:text-[#F1F5F9]">
          Sugestão: <strong>Beatriz deve R$ 510,00 a Lucas</strong>
        </p>
      </div>
      <button type="button" class="text-[13px] font-bold text-[#00A868] dark:text-[#34D399] hover:underline whitespace-nowrap shrink-0">
        Usar este valor
      </button>
    </div>

    <!-- Campo Valor com alinhamento à direita -->
    <div class="space-y-1.5">
      <label for="reembolso-valor" class="block text-[14px] font-medium text-[#64748B] dark:text-[#94A3B8]">Valor</label>
      <div class="relative flex items-center">
        <span class="absolute left-3.5 text-[15px] font-medium text-[#64748B] dark:text-[#94A3B8]">R$</span>
        <input type="text" id="reembolso-valor" value="510,00" class="w-full h-11 pl-12 pr-3.5 rounded-lg border border-[#E2E8F0] dark:border-[#334155] bg-[#F8FAFC] dark:bg-[#1E293B] text-[#0F172A] dark:text-[#F1F5F9] font-semibold text-[17px] text-right font-mono tracking-tight focus:outline-none focus:ring-2 focus:ring-[#00A868] dark:focus:ring-[#34D399] transition-all" />
      </div>
    </div>

    <!-- Campo Observação (opcional) -->
    <div class="space-y-1.5">
      <label for="reembolso-obs" class="block text-[14px] font-medium text-[#64748B] dark:text-[#94A3B8]">Observação (opcional)</label>
      <textarea id="reembolso-obs" rows="3" placeholder="Ex.: Pix enviado em 12/08" class="w-full p-3 rounded-lg border border-[#E2E8F0] dark:border-[#334155] bg-[#F8FAFC] dark:bg-[#1E293B] text-[#0F172A] dark:text-[#F1F5F9] placeholder-[#94A3B8] text-[14px] focus:outline-none focus:ring-2 focus:ring-[#00A868] dark:focus:ring-[#34D399] resize-none transition-all"></textarea>
    </div>
  </main>

  <!-- Rodapé de Ações -->
  <footer class="px-4 pt-4 space-y-3">
    <button type="button" class="w-full h-12 rounded-lg bg-[#00A868] dark:bg-[#34D399] text-white dark:text-[#0F172A] font-semibold text-[16px] hover:bg-[#00875A] dark:hover:bg-[#6EE7B7] active:scale-[0.99] transition-all flex items-center justify-center shadow-sm">
      Registrar reembolso
    </button>
    <a href="#/rateios/1" class="block text-center text-[15px] font-medium text-[#64748B] dark:text-[#94A3B8] hover:text-[#0F172A] dark:hover:text-[#F1F5F9] py-1 transition-colors">
      Cancelar
    </a>
  </footer>
</body>
</html>

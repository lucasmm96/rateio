name: Atualizar IPCA

on:
  workflow_dispatch:
    inputs:
      serie:
        description: 'Código da série BCB (padrão: 433 = IPCA mensal)'
        required: false
        default: '433'
  schedule:
    # Dias 9 a 15 de cada mês às 09:00 UTC
    # (BCB publica o IPCA entre os dias 9 e 15)
    - cron: '0 9 9 * *'
    - cron: '0 9 10 * *'
    - cron: '0 9 11 * *'
    - cron: '0 9 12 * *'
    - cron: '0 9 13 * *'
    - cron: '0 9 14 * *'
    - cron: '0 9 15 * *'

jobs:
  atualizar-ipca:
    name: Buscar série BCB e fazer upsert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install pg

      - name: Diagnóstico — current_user e policies no banco
        env:
          IPCA_WRITER_DATABASE_URL: ${{ secrets.IPCA_WRITER_DATABASE_URL }}
        run: |
          node -e "
          const { Client } = require('pg');
          const c = new Client({ connectionString: process.env.IPCA_WRITER_DATABASE_URL });
          c.connect()
            .then(() => c.query('SELECT current_user, session_user'))
            .then(r => { console.log('roles:', JSON.stringify(r.rows[0])); })
            .then(() => c.query(\"SELECT policyname, cmd, qual, with_check FROM pg_policies WHERE tablename = 'taxas_ipca'\"))
            .then(r => { console.log('policies:', JSON.stringify(r.rows)); return c.end(); })
            .catch(e => { console.error(e.message); process.exit(1); });
          "

      - name: Executar seed-taxas.mjs
        env:
          IPCA_WRITER_DATABASE_URL: ${{ secrets.IPCA_WRITER_DATABASE_URL }}
          BCB_SERIE: ${{ inputs.serie || '433' }}
        run: node scripts/seed-taxas.mjs

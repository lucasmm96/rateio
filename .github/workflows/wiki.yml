name: Sync wiki

on:
  push:
    branches: [master]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Espelhar wiki/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validar conteúdo
        run: |
          set -euo pipefail
          test -f wiki/Home.md
          test -n "$(find wiki -type f -name '*.md' -print -quit)"

      - name: Clonar wiki
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -euo pipefail
          WIKI_DIR="$RUNNER_TEMP/wiki-repo"
          rm -rf "$WIKI_DIR"
          if ! git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$WIKI_DIR"; then
            echo "::error::Falha ao clonar a wiki. Verifique se ela está inicializada e se o token tem contents: write."
            exit 1
          fi

      - name: Espelhar wiki/
        run: |
          set -euo pipefail
          WIKI_DIR="$RUNNER_TEMP/wiki-repo"
          rsync -a --delete --exclude='.git/' wiki/ "$WIKI_DIR/"
          cd "$WIKI_DIR"
          git status --short

      - name: Commit e push
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wiki-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki já está sincronizada; nada a fazer."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
